---
- name: Setup server
  hosts: all

  # Gather machine informations
  gather_facts: false

  # Enable root previlegies
  become: true

  vars:
    server_user: "{{ test | default(global_server_user) }}"
    data_path: "{{ test | default(global_data_path) }}"

  # Run suitable scripts
  tasks:
    - name: Install Container Manager
      ansible.builtin.package:
        name:
          - crun # Container runtime
          - podman # Container manager
          - slirp4netns # Allow user-mode networking for unprivileged network namespaces
          - uidmap # Handle user namespace
          - dbus-user-session
          - fuse-overlayfs
          - systemd-container
        state: present

    - name: Create Dedicated User
      ansible.builtin.user:
        name: "{{ server_user }}"

    - name: Set authorized key taken from file
      ansible.posix.authorized_key:
        user: "{{ server_user }}"
        state: present
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

    # Avoid the user session to close
    - name: Enable linger for {{ server_user }} user
      ansible.builtin.command: "loginctl enable-linger {{ server_user }}"

    - name: Ensure the {{ server_user }} user has write permissions on the folder
      ansible.builtin.file:
        path: "{{ data_path }}"
        mode: u+rw # Adds write permission for all users (owner, group, others)
        # OR you can be more specific using octal notation:
        # mode: 0775 # Owner: rwx, Group: rwx, Others: rx
        # mode: "u+rw,g+w" # Owner and group get read and write
        owner: "{{ server_user }}" # Optionally set the owner of the folder
        recurse: no # Only apply to the folder itself, not its contents


    #- name: Create inventory for application deployement
