---
- name: n8n
  hosts: all

  # Gather machine informations
  gather_facts: no

  # Enable root previlegies
  become: no

  vars:
    app_name: n8n
    app_image: docker.io/n8nio/n8n:1.121.1
    app_internal_port: 5678
    app_external_port: 5678

    app_data_path: "{{ global_app_data_path }}/{{ app_name }}"
    app_timezone: "{{ global_timezone }}"

  # Run suitable scripts
  tasks:
    - name: Create {{ app_name }} data directory
      file:
        path: "{{ app_data_path }}"
        state: directory
        mode: "0755"

    - name: Create {{ app_name }} data directory
      file:
        path: "{{ global_data_path }}/n8n"
        state: directory
        mode: "0755"

    #- name: Create {{ app_name }} config directory
    #  file:
    #    path: "{{ global_data_path }}/n8n_data/config"
    #    state: directory
    #    mode: "0755"

    - name: Pull {{ app_name }} image
      containers.podman.podman_image:
        name: "{{ app_image }}"
        state: present

    - name: Create {{ app_name }} container
      containers.podman.podman_container:
        name: "{{ app_name }}"
        image: "{{ app_image }}"
        state: started
        recreate: yes
        memory: 1gb
        ports:
          - "{{ app_external_port }}:{{ app_internal_port }}"
        expose:
          - "{{ app_external_port }}"
        volumes:
          - "{{ global_data_path }}/n8n:/home/node/.n8n:z,U"
        env:
          PUID: 1001
          PGID: 1001
          TZ: "{{ app_timezone }}"
          N8N_SECURE_COOKIE: false

    - name: Systemd unit files for {{ app_name }} container
      containers.podman.podman_generate_systemd:
        name: "{{ app_name }}"
        dest: "~/.config/systemd/user/"
