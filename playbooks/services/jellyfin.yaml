---
- name: Jellyfin
  hosts: all

  # Gather machine informations
  gather_facts: no

  # Enable root previlegies
  become: no

  vars:
    app_name: jellyfin
    app_image: docker.io/jellyfin/jellyfin:10.10.7
    app_internal_port: 8096
    app_external_port: 8096

    app_data_path: "{{ global_app_data_path }}/{{ app_name }}"
    app_timezone: "{{ global_timezone }}"

  # Run suitable scripts
  tasks:

    - name: Create {{ app_name }} data directory
      file:
        path: "{{ app_data_path }}"
        state: directory
        mode: '0755'

    - name: Create {{ app_name }} shows directory
      file:
        path: "{{ global_data_path }}/shows"
        state: directory
        mode: '0755'

    - name: Create {{ app_name }} movies directory
      file:
        path: "{{ global_data_path }}/movies"
        state: directory
        mode: '0755'

    - name: Pull {{ app_name }} image
      containers.podman.podman_image:
        name: "{{ app_image }}"
        state: present

    - name: Create {{ app_name }} container
      containers.podman.podman_container:
        name: "{{ app_name }}"
        image: "{{ app_image }}"
        state: started
        recreate: yes
        memory: 256m
        ports:
          - "{{ app_external_port }}:{{ app_internal_port }}"
        expose:
          - "{{ app_external_port }}"
        volumes:
          - "{{ app_data_path }}/:/config"
          - "{{ global_data_path }}/shows:/data/shows"
          - "{{ global_data_path }}/movies:/data/movies"
        env:
          PUID: 1000
          PGID: 1000
          TZ: "{{ app_timezone }}"
    
    - name: Systemd unit files for {{ app_name }} container
      containers.podman.podman_generate_systemd:
        name: "{{ app_name }}"
        dest: "~/.config/systemd/user/"
