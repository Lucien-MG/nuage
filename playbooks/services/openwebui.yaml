---
- name: openwebui
  hosts: all

  # Gather machine informations
  gather_facts: no

  # Enable root previlegies
  become: no

  vars:
    app_name: openwebui
    app_image: ghcr.io/open-webui/open-webui:main
    app_internal_port: 3000
    app_external_port: 8095

    app_data_path: "{{ global_app_data_path }}/{{ app_name }}"
    app_timezone: "{{ global_timezone }}"

  # Run suitable scripts
  tasks:
    - name: Create {{ app_name }} data directory
      file:
        path: "{{ app_data_path }}"
        state: directory
        mode: "0755"

    - name: Create {{ app_name }} data directory
      file:
        path: "{{ global_data_path }}/openwebui"
        state: directory
        mode: "0755"

    - name: Pull {{ app_name }} image
      containers.podman.podman_image:
        name: "{{ app_image }}"
        state: present

    - name: Create {{ app_name }} container
      containers.podman.podman_container:
        name: "{{ app_name }}"
        image: "{{ app_image }}"
        state: started
        recreate: yes
        memory: 1gb
        network: host
        ports:
          - "{{ app_external_port }}:{{ app_internal_port }}"
        expose:
          - "{{ app_external_port }}"
        volumes:
          - "{{ global_data_path }}/openwebui:/app/backend/data"
        env:
          PUID: 1000
          PGID: 1000
          TZ: "{{ app_timezone }}"
          OLLAMA_ORIGINS: http://100.70.35.33

    - name: Systemd unit files for {{ app_name }} container
      containers.podman.podman_generate_systemd:
        name: "{{ app_name }}"
        dest: "~/.config/systemd/user/"
